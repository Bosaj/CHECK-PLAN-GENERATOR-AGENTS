name: CI — Lint, Test & Docker Build

on:
  push:
    branches: [main, frontend, backend, ai]
  pull_request:
    branches: [main]

jobs:
  # ── Python (check_planner) ─────────────────────────────────
  python-lint-test:
    name: Python Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check check_planner/ --select=E,W,F --ignore=E501

      - name: Run tests
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pytest tests/ -v --tb=short --cov=check_planner --cov-report=term-missing
        env:
          GOOGLE_API_KEY: "dummy_key_for_ci"

  # ── JavaScript / Next.js ────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build (type-check)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_CHECK_PLANNER_URL: http://localhost:8057

  # ── Docker Build ────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [python-lint-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build check-planner image
        run: docker build -f docker/Dockerfile.backend -t check-planner:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t cdg-frontend:ci ./frontend
