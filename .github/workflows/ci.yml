name: CI — Pipeline

on:
  push:
    branches: [main, frontend, backend, ai]
  pull_request:
    branches: [main]

jobs:
  python-lint-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling pytest pytest-asyncio pytest-cov ruff
          pip install -e .

      - name: Lint with ruff
        run: ruff check check_planner/ --ignore=E501,F841,F401,B008 || true

      - name: Run tests
        run: pytest tests/ -v --tb=short

  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint || true

      - name: Build check
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_AI_AGENT_URL: http://localhost:8000

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [python-lint-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build AI agent image
        run: docker build -t check-planner-agent:ci .

      - name: Build frontend image
        run: docker build -t cdg-frontend:ci ./frontend
