name: CI — Self-Hosted Runner Pipeline

on:
  push:
    branches: [main, frontend, backend, ai]
  pull_request:
    branches: [main]

jobs:
  python-lint-test:
    name: Python Lint + Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install --no-cache-dir hatchling pytest pytest-asyncio pytest-cov ruff
          pip install -e .

      - name: Lint with ruff
        run: ruff check check_planner/

      - name: Run tests
        run: pytest tests/ -v --tb=short

  frontend-lint:
    name: Frontend Lint & Build
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build check
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_AI_AGENT_URL: http://localhost:8000

  docker-build:
    name: Docker Build Check
    runs-on: self-hosted
    needs: [python-lint-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build AI agent container
        run: docker build -t check-planner-agent:ci .

      - name: Build frontend container
        run: docker build -t cdg-frontend:ci ./frontend
