services:
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdg-check-planner-agent
    ports:
      - "8057:8057"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped

  java-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cdg-capital-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/cdg_capital
      - JWT_SECRET=${JWT_SECRET:-defaultSecretKeyForJwtTokenGenerationMustBeLongEnough12345}
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cdg-capital-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081
      - NEXT_PUBLIC_AI_AGENT_URL=http://localhost:8057
    depends_on:
      - java-backend
      - ai-agent
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: cdg-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data: